<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">SharedCart collaboration workflow</title>
  <desc id="description">A four-step diagram showing a group being created, an invitation shared, a list maintained together, and a purchase update sent to members.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#eefaf3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="url(#background)"/>
  <text x="480" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172b4d">One shared list. Everyone in sync.</text>
  <text x="480" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52657d">Create a group, invite people, shop together, and keep the list current.</text>
  <g fill="none" stroke="#9ab6d5" stroke-width="3" stroke-linecap="round"><path d="M211 220h47"/><path d="M450 220h47"/><path d="M689 220h47"/></g>
  <g fill="#9ab6d5"><path d="M258 214l12 6-12 6z"/><path d="M497 214l12 6-12 6z"/><path d="M736 214l12 6-12 6z"/></g>
  <g filter="url(#shadow)"><rect x="42" y="137" width="170" height="166" rx="18" fill="#fff"/><rect x="281" y="137" width="170" height="166" rx="18" fill="#fff"/><rect x="520" y="137" width="170" height="166" rx="18" fill="#fff"/><rect x="759" y="137" width="170" height="166" rx="18" fill="#fff"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(127 181)"><circle r="29" fill="#dfeaff"/><path d="M-13 8h26M0-13v26" stroke="#356ae6" stroke-width="5" stroke-linecap="round"/><text y="66" font-size="18" font-weight="700" fill="#172b4d">Create a group</text><text y="91" font-size="13" fill="#52657d">Start a shared space</text></g>
    <g transform="translate(366 181)"><circle r="29" fill="#e6f8ef"/><path d="M-15 3l28-13 3 29-10-8-8 9-6-5 8-9z" fill="#20a464"/><text y="66" font-size="18" font-weight="700" fill="#172b4d">Share an invite</text><text y="91" font-size="13" fill="#52657d">Link or QR code</text></g>
    <g transform="translate(605 181)"><circle r="29" fill="#fff2d8"/><path d="M-13-13h26v27h-26zM-7-5h14M-7 2h14M-7 9h8" fill="none" stroke="#e79725" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text y="66" font-size="18" font-weight="700" fill="#172b4d">Build the list</text><text y="91" font-size="13" fill="#52657d">Add items and quantities</text></g>
    <g transform="translate(844 181)"><circle r="29" fill="#f1e7ff"/><path d="M-14 1l9 10 19-22" fill="none" stroke="#8a57d6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text y="66" font-size="18" font-weight="700" fill="#172b4d">Shop together</text><text y="91" font-size="13" fill="#52657d">Complete and update</text></g>
  </g>
  <g transform="translate(285 344)"><rect width="390" height="40" rx="20" fill="#173d72"/><text x="195" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">A clear list for the whole household</text></g>
</svg>
